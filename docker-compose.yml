services:
  db:
    image: postgres:16-alpine
    container_name: colabmodel-db
    environment:
      POSTGRES_DB: colabmodel
      POSTGRES_USER: colabmodel
      POSTGRES_PASSWORD: colabmodel
    ports:
      - "55432:5432"         # Puerto alto para no chocar con PostgreSQL nativo de Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colabmodel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
