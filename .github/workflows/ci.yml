name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # ApiDeProyectosTest y AtajoDeDesarrolloTest (ADR-026) prueban contra PostgreSQL de
    # verdad, en su propia base (colabmodel_test). Sin este servicio se OMITIRIAN en el CI
    # y las migraciones, las transacciones y el WebSocket quedarian sin probar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colabmodel
          POSTGRES_PASSWORD: colabmodel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colabmodel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compilar y probar backend
        working-directory: backend
        run: mvn -B verify -Dcolabmodel.test.db=jdbc:postgresql://localhost:5432/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, probar y construir frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm test
          npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Probar el motor de intenciones
        working-directory: mobile
        run: |
          flutter pub get
          flutter test

  apk:
    # Que el proyecto Android compile (T-03b). Solo el APK de depuracion: no se firma ni se publica.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compilar el APK de depuracion
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: colabmodel-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
