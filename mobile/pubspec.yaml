name: colabmodel_app
description: Asistente de voz que consume cualquier backend generado por ColabModel.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  uuid: ^4.5.1
  flutter_secure_storage: ^11.2.0  # JWT en almacenamiento seguro del sistema (T-17)
  stomp_dart_client: ^2.1.3
  shared_preferences: ^2.3.3
  speech_to_text: ^7.5.0          # STT del sistema; intenta reconocer en el dispositivo (T-03c)

  # --- Salida de voz: fuera de T-03c (posible T-03d) ---
  # flutter_tts: ^4.2.0           # TTS del sistema, funciona sin red

  # --- Fase 4 (offline + sincronizacion) ---
  # sqflite: ^2.4.1               # base local
  # path: ^1.9.0
  # connectivity_plus: ^6.1.0     # detecta que volvio la red
  # workmanager: ^0.5.2           # drena el outbox en segundo plano

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
